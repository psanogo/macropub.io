<!DOCTYPE html>
<html>
<body>

<h2>Login</h2>

<input id="user" placeholder="Username">
<button onclick="login()">Login</button>

<script>
function login() {
  const u = document.getElementById("user").value;
  localStorage.setItem("user", u);
  alert("Logged in as " + u);
}
</script>

</body>
</html>
